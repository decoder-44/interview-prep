version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: interview-prep-postgres
    environment:
      POSTGRES_DB: interview_prep_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - interview-prep-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./interview-prep-backend
    container_name: interview-prep-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/interview_prep_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - interview-prep-network
    command: java -jar app.jar

volumes:
  postgres_data:

networks:
  interview-prep-network:
    driver: bridge
    